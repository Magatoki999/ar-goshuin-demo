<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8">
    <title>北野天満宮・飛梅と祈りの鶴 ARプロトタイプ</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    
    <style>
      a-scene .a-enter-vr-button, a-scene .a-enter-ar-button { display: none; }
      
      #start-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0, 0, 0, 0.9); 
        z-index: 9999;
        display: flex; justify-content: center; align-items: center; flex-direction: column;
        color: white; font-family: 'Yu Mincho', 'Hiragino Mincho ProN', serif; cursor: pointer;
        transition: opacity 1.5s ease;
        text-align: center;
      }
      #start-overlay h1 { font-size: 26px; font-weight: normal; margin-bottom: 20px; letter-spacing: 2px;}
      #start-overlay p { font-size: 15px; color: #ddd; line-height: 1.8; }

      #capture-btn {
        display: none; position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
        z-index: 9998; background: rgba(212, 175, 55, 0.9); color: #000; 
        padding: 15px 30px; border-radius: 30px; border: 1px solid #FFF;
        font-family: 'Yu Mincho', 'Hiragino Mincho ProN', serif; font-size: 16px; font-weight: bold;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
        transition: background 0.3s;
      }
      #capture-btn:active { background: rgba(255, 215, 0, 1); }

      #result-modal {
        display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.95); z-index: 10000;
        flex-direction: column; align-items: center; justify-content: center;
        color: white; font-family: 'Yu Mincho', 'Hiragino Mincho ProN', serif; text-align: center;
      }
      #result-modal p { font-size: 14px; margin-bottom: 15px; letter-spacing: 1px; color: #ccc;}
      #result-image { max-width: 90%; max-height: 75%; border: 2px solid #D4AF37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); object-fit: contain;}
      #close-modal { margin-top: 25px; padding: 10px 40px; border: 1px solid #fff; border-radius: 20px; cursor: pointer; font-size: 14px; }
    </style>

    <script>
      AFRAME.registerComponent('petal-system', {
        schema: { count: {type: 'int', default: 40}, texture: {type: 'string', default: '#umeTexture'}, area: {type: 'number', default: 0.8} },
        init: function () {
          this.petals = [];
          for (let i = 0; i < this.data.count; i++) {
            let el = document.createElement('a-image');
            el.setAttribute('src', this.data.texture);
            let size = Math.random() * 0.03 + 0.02; 
            el.setAttribute('scale', `${size} ${size} ${size}`);
            el.setAttribute('transparent', 'true'); el.setAttribute('alpha-test', '0.1');
            this.el.appendChild(el);
            this.petals.push({
              el: el, y: (Math.random() - 0.5) * 2, radius: Math.random() * this.data.area + 0.1, angle: Math.random() * Math.PI * 2,
              speedY: Math.random() * 0.002 + 0.001, speedAngle: (Math.random() - 0.5) * 0.02,
              rotX: Math.random() * 360, rotY: Math.random() * 360, rotZ: Math.random() * 360,
              rotSpeedX: (Math.random() - 0.5) * 5, rotSpeedY: (Math.random() - 0.5) * 5, rotSpeedZ: (Math.random() - 0.5) * 5
            });
          }
        },
        tick: function (time, timeDelta) {
          this.petals.forEach(p => {
            p.angle += p.speedAngle; p.y += p.speedY; if (p.y > 1.5) p.y = -0.5;
            let x = Math.cos(p.angle) * p.radius; let z = Math.sin(p.angle) * p.radius;
            p.el.setAttribute('position', `${x} ${p.y} ${z}`);
            p.rotX += p.rotSpeedX; p.rotY += p.rotSpeedY; p.rotZ += p.rotSpeedZ;
            p.el.setAttribute('rotation', `${p.rotX} ${p.rotY} ${p.rotZ}`);
          });
        }
      });

      AFRAME.registerComponent('boiling-effect', {
        schema: { intensity: {type: 'number', default: 0.0015}, speed: {type: 'number', default: 100} },
        init: function() {
          this.lastTime = 0; this.baseX = this.el.object3D.position.x; this.baseY = this.el.object3D.position.y;
        },
        tick: function(time) {
          if (time - this.lastTime < this.data.speed) return;
          this.lastTime = time;
          let dx = (Math.random() - 0.5) * this.data.intensity; let dy = (Math.random() - 0.5) * this.data.intensity; let dr = (Math.random() - 0.5) * 0.01; 
          this.el.object3D.position.x = this.baseX + dx; this.el.object3D.position.y = this.baseY + dy; this.el.object3D.rotation.z = dr;
        }
      });
    </script>
  </head>
  <body>
    <div id="start-overlay">
      <h1>参拝を開始します</h1>
      <p>スマートフォンを持ったまま軽く一礼し、<br>画面をタップしてください</p>
    </div>

    <div id="capture-btn">参拝の証を刻む</div>

    <div id="result-modal">
      <p>画像を長押しして保存してください</p>
      <img id="result-image" src="" alt="参拝の証">
      <div id="close-modal">戻る</div>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: yes;"
      color-space="sRGB" renderer="colorManagement: true; preserveDrawingBuffer: true;"
      vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <img id="umeTexture" src="./ume_petal.png" crossorigin="anonymous">
        <img id="kamonTexture" src="./kamon.png" crossorigin="anonymous">
        <img id="inkAura" src="./ink_aura.png" crossorigin="anonymous"> 
        <a-asset-item id="orizuruModel" src="./oritsuru_merrygoround.glb"></a-asset-item>
        <audio id="sacredAudio" src="./tenmangu_ambient.mp3" preload="auto" loop></audio>
      </a-assets>

      <a-light id="ambient-light" type="ambient" color="#ffffff" intensity="2.0"></a-light>
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target0" mindar-image-target="targetIndex: 0">
        <a-entity id="manifestation" visible="false">
          
          <a-image id="inkManifestation" src="#inkAura" position="0 0 0.02" scale="1.5 1.5 1" material="shader: flat; transparent: true; depthWrite: false; opacity: 0;" boiling-effect="intensity: 0.002; speed: 120;"></a-image>

          <a-entity position="0 0 0.05" animation="property: scale; from: 0.75 0.75 0.75; to: 0.85 0.85 0.85; dir: alternate; loop: true; dur: 4000; easing: easeInOutSine;">
            <a-image src="#kamonTexture" scale="1 1 1" material="transparent: true; blending: additive; opacity: 0.8;" animation="property: rotation; to: 0 0 360; loop: true; dur: 30000; easing: linear;"></a-image>
          </a-entity>

          <a-gltf-model src="#orizuruModel" position="0 0 0.1" scale="0.1 0.1 0.1" animation-mixer></a-gltf-model>
          <a-entity position="0 0 0.1" petal-system="count: 40; area: 0.8;"></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      // ★追加：時間帯に応じた設定を返す関数
      function getTimeDependentSettings() {
        const hour = new Date().getHours();
        let lightColor, message;

        if (hour >= 5 && hour < 11) {
          // 朝 (5:00 - 10:59)
          lightColor = "#e6f0ff"; // 少し青みがかった清冽な白
          message = "朝霧に包まれた清冽な祈り";
        } else if (hour >= 11 && hour < 16) {
          // 昼 (11:00 - 15:59)
          lightColor = "#ffffff"; // 純白
          message = "白日の光に溶け込む祈り";
        } else if (hour >= 16 && hour < 19) {
          // 夕方 (16:00 - 18:59)
          lightColor = "#ffd7a0"; // 黄金色・オレンジ
          message = "黄昏時に捧げる静かな祈り";
        } else {
          // 夜 (19:00 - 4:59)
          lightColor = "#4a548c"; // 深い青・紫
          message = "月明かりに照らされた夜の祈り";
        }
        
        return { lightColor, message };
      }

      // ページ読み込み時にAR空間の光の色を設定
      document.addEventListener("DOMContentLoaded", () => {
        const settings = getTimeDependentSettings();
        const lightEl = document.getElementById('ambient-light');
        if (lightEl) {
          lightEl.setAttribute('color', settings.lightColor);
        }
      });

      const overlay = document.getElementById('start-overlay');
      const audioEl = document.querySelector('#sacredAudio');
      const targetEl = document.querySelector('#target0');
      const manifestationEl = document.querySelector('#manifestation');
      const inkManifestationEl = document.querySelector('#inkManifestation');
      
      const captureBtn = document.getElementById('capture-btn');
      const resultModal = document.getElementById('result-modal');
      const resultImage = document.getElementById('result-image');
      const closeModal = document.getElementById('close-modal');

      let lostTimeout; 
      let isTracking = false; 

      overlay.addEventListener('click', function() {
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 1500);
        try {
          audioEl.volume = 0; audioEl.play().then(() => { audioEl.pause(); audioEl.currentTime = 0; });
        } catch(e) {}
      });

      AFRAME.registerComponent('ar-control', {
        init: function () {
          targetEl.addEventListener('targetFound', event => {
            isTracking = true;
            if (lostTimeout) { clearTimeout(lostTimeout); lostTimeout = null; }
            manifestationEl.setAttribute('visible', true);
            captureBtn.style.display = 'block'; 
            this.playInkSequence();
            audioEl.volume = 0.3; audioEl.play(); 
          });

          targetEl.addEventListener('targetLost', event => {
            isTracking = false;
            captureBtn.style.display = 'none'; 
            lostTimeout = setTimeout(() => {
              manifestationEl.setAttribute('visible', false);
              this.resetInkManifestation();
              audioEl.pause();
            }, 3000); 
          });
        },
        playInkSequence: function () {
          this.resetInkManifestation();
          inkManifestationEl.setAttribute('animation__bleed', 'property: material.opacity; from: 0; to: 0.8; dur: 2000; easing: easeOutCubic;');
          this.fadeOutTimeout = setTimeout(() => {
            if (isTracking) { inkManifestationEl.setAttribute('animation__fadeout', 'property: material.opacity; from: 0.8; to: 0; dur: 4000; easing: easeInCubic;'); }
          }, 5000);
        },
        resetInkManifestation: function () {
          if (this.fadeOutTimeout) { clearTimeout(this.fadeOutTimeout); this.fadeOutTimeout = null; }
          inkManifestationEl.removeAttribute('animation__bleed'); inkManifestationEl.removeAttribute('animation__fadeout');
          inkManifestationEl.setAttribute('material.opacity', 0);
        }
      });
      document.querySelector('a-scene').setAttribute('ar-control', '');

      captureBtn.addEventListener('click', () => {
        const sceneEl = document.querySelector('a-scene');
        const aframeCanvas = sceneEl.canvas;
        const video = document.querySelector('video');

        sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);

        const w = window.innerWidth;
        const h = window.innerHeight;
        
        const canvas = document.createElement('canvas');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        if (video) {
          const videoRatio = video.videoWidth / video.videoHeight;
          const screenRatio = w / h;
          let drawWidth, drawHeight, startX, startY;
          if (videoRatio > screenRatio) {
              drawHeight = h;
              drawWidth = video.videoWidth * (h / video.videoHeight);
              startX = (w - drawWidth) / 2;
              startY = 0;
          } else {
              drawWidth = w;
              drawHeight = video.videoHeight * (w / video.videoWidth);
              startX = 0;
              startY = (h - drawHeight) / 2;
          }
          ctx.drawImage(video, startX, startY, drawWidth, drawHeight);
        }

        if (aframeCanvas) {
          ctx.drawImage(aframeCanvas, 0, 0, w, h);
        }

        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, w, 100); 
        ctx.fillRect(0, h - 100, w, 100); 

        ctx.fillStyle = '#FFF';
        ctx.textAlign = 'center';
        
        ctx.font = 'bold 28px "Yu Mincho", "Hiragino Mincho ProN", serif';
        ctx.fillText('参拝之証', w / 2, 45);

        const now = new Date();
        const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
        ctx.font = '16px "Yu Mincho", "Hiragino Mincho ProN", serif';
        ctx.fillText(dateStr, w / 2, 75);

        // ★変更：時間帯によって変わるメッセージを描画
        const settings = getTimeDependentSettings();
        ctx.font = 'italic 16px "Yu Mincho", "Hiragino Mincho ProN", serif';
        ctx.fillText(settings.message, w / 2, h - 45);

        resultImage.src = canvas.toDataURL('image/jpeg', 0.9);
        resultModal.style.display = 'flex';
      });

      closeModal.addEventListener('click', () => {
        resultModal.style.display = 'none';
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          audioEl.pause();
        } else {
          if (isTracking) {
            audioEl.play().catch(e => console.warn("音声再開スキップ:", e));
          }
        }
      });
    </script>
  </body>
</html>
